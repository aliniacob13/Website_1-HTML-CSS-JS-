<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <script src="signup.js" defer></script>
</head>
<body>
    <div class="dateContainer" id="dateContainer"></div>
    <div class="container">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <label for="newUsername">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="newPassword">Password(5 lowercase letters, followed by 2 digits):</label>
            <input type="password" id="newPassword" name="newPassword" pattern="[a-z]{5}[0-9]{2}" required>
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" pattern="[a-z]{5}[0-9]{2}" required>
            <button type="submit">Sign Up</button>
        </form>
        <button id="loginButton">Login</button>
    </div>
</body>
</html>
